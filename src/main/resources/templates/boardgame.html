<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="fragments/header.html :: html-head(title=|BoardUniverse - ${boardgame.name}|)">
    <title>BoardUniverse - Board Games</title>
</head>

<body>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="glass-card">
                    <!-- Title Section -->
                    <div class="text-center mb-5">
                        <span class="fs-1 display-1 text-center mb-3 d-block">🎲</span>
                        <h1 class="display-5 font-weight-bold text-white mb-2" th:text="${boardgame.name}">Boardgame Name</h1>
                        <span class="badge fs-6 px-3 py-2" style="background: var(--gradient-cosmic); color: white;" th:text="${boardgame.gameType}">Strategy Game</span>
                    </div>

                    <!-- Specs Details Grid -->
                    <div class="row g-4 mb-5">
                        <!-- Level -->
                        <div class="col-sm-4 text-center">
                            <div class="p-4 rounded h-100" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--border-glass);">
                                <i class="fa-solid fa-graduation-cap fs-2 text-purple mb-3"></i>
                                <h5 class="text-muted mb-1 fs-6 uppercase">Complexity Level</h5>
                                <h4 class="text-white mb-0" th:text="${boardgame.level} + ' / 5'">3 / 5</h4>
                                <small class="text-muted fs-7">1-Easy | 5-Difficult</small>
                            </div>
                        </div>

                        <!-- Players -->
                        <div class="col-sm-4 text-center">
                            <div class="p-4 rounded h-100" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--border-glass);">
                                <i class="fa-solid fa-users fs-2 text-cyan mb-3"></i>
                                <h5 class="text-muted mb-1 fs-6 uppercase">Players Limit</h5>
                                <h4 class="text-white mb-0" th:unless="${boardgame.maxPlayers} == '+'" th:text="${boardgame.minPlayers} + ' - ' + ${boardgame.maxPlayers}">2 - 4</h4>
                                <h4 class="text-white mb-0" th:if="${boardgame.maxPlayers} == '+'" th:text="${boardgame.minPlayers} + ' + Players'">2+</h4>
                                <small class="text-muted fs-7">Optimal Setup</small>
                            </div>
                        </div>

                        <!-- Reviews -->
                        <div class="col-sm-4 text-center">
                            <div class="p-4 rounded h-100" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--border-glass); cursor: pointer;" th:onclick="|location.href='@{/${boardgame.id}/reviews}'|">
                                <i class="fa-solid fa-comments fs-2 text-emerald mb-3"></i>
                                <h5 class="text-muted mb-1 fs-6 uppercase">User Reviews</h5>
                                <h4 class="text-cyan mb-0" style="font-weight: 600;">Browse Reviews</h4>
                                <small class="text-muted fs-7">Read feedback</small>
                            </div>
                        </div>
                    </div>

                    <!-- Actions and Security -->
                    <hr class="border-secondary mb-4">

                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <a href="/" class="btn btn-outline-secondary text-white border-secondary-subtle px-4 py-2"><i class="fa-solid fa-arrow-left me-2"></i>Back to Catalog</a>
                        
                        <div sec:authorize="!hasRole('ROLE_USER')" class="text-end">
                            <span class="text-muted me-2">Want to write a review?</span>
                            <a th:href="@{/login}" class="btn btn-primary px-4 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</a>
                        </div>

                        <div sec:authorize="hasRole('ROLE_USER') || hasRole('ROLE_MANAGER')">
                            <a th:href="@{|/${boardgame.id}/reviews|}" class="btn btn-primary px-4 py-2"><i class="fa-solid fa-plus me-2"></i>Add Review</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer.html :: page-footer"></footer>
</body>

</html>
