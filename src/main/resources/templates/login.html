<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header.html :: html-head(title='BoardUniverse - Sign In')"></head>

<body>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="glass-card">
                    <!-- Title -->
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-astronaut fs-1 text-cyan mb-3"></i>
                        <h1 class="fs-2 text-white mb-2">Welcome Back</h1>
                        <p class="text-muted">Sign in to manage and review board games.</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${param.error}" class="alert alert-danger border-0 bg-danger-subtle text-danger p-3 rounded mb-4">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info border-0 bg-info-subtle text-info p-3 rounded mb-4">
                        <i class="fa-solid fa-circle-info me-2"></i>You have been successfully logged out.
                    </div>

                    <!-- Form -->
                    <form action="#" th:action="@{/login}" method="post">
                        <!-- Username -->
                        <div class="mb-4">
                            <label for="inputUserName" class="form-label text-muted fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-slate border-glass text-muted" style="background: rgba(15,23,42,0.6); border-right: none;"><i class="fa-solid fa-user"></i></span>
                                <input type="text" name="username" class="form-control" id="inputUserName" placeholder="Enter username" style="border-left: none;">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-5">
                            <label for="inputPassword" class="form-label text-muted fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-slate border-glass text-muted" style="background: rgba(15,23,42,0.6); border-right: none;"><i class="fa-solid fa-key"></i></span>
                                <input type="password" name="password" class="form-control" id="inputPassword" placeholder="Enter password" style="border-left: none;">
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-grid gap-2 mb-4">
                            <button type="submit" class="btn btn-primary py-3 fs-6">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                            </button>
                        </div>
                    </form>

                    <!-- Credentials Helper Widget -->
                    <div class="p-3 rounded mb-4" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--border-glass);">
                        <div class="fs-7 text-muted fw-bold mb-2 uppercase text-center"><i class="fa-solid fa-lightbulb me-1 text-warning"></i> Demo Accounts</div>
                        <div class="d-flex justify-content-between fs-7 text-muted border-bottom border-secondary border-opacity-25 pb-1 mb-1">
                            <span>User: <strong class="text-white">bugs</strong> | Pass: <strong class="text-white">bunny</strong></span>
                            <span class="badge bg-secondary">Collector</span>
                        </div>
                        <div class="d-flex justify-content-between fs-7 text-muted">
                            <span>Manager: <strong class="text-white">daffy</strong> | Pass: <strong class="text-white">duck</strong></span>
                            <span class="badge bg-purple">Manager</span>
                        </div>
                    </div>

                    <!-- Footer signup prompt -->
                    <div class="text-center border-top border-secondary border-opacity-25 pt-3 fs-7 text-muted">
                        Don't have an account? <a href="#" th:href="@{/newUser}" class="text-cyan fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer.html :: page-footer"></footer>
</body>

</html>
