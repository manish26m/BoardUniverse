<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header.html :: html-head(title='BoardUniverse - Create Account')">
    <title>BoardUniverse - Create Account</title>
</head>

<body>
    <script src="../static/js/script.js" th:src="@{/js/script.js}"></script>
    <nav th:replace="fragments/links :: nav.navigation-links"></nav>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="glass-card">
                    <!-- Title -->
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus fs-1 text-purple mb-3"></i>
                        <h1 class="fs-2 text-white mb-2">Create Account</h1>
                        <p class="text-muted">Register an account and start managing board games.</p>
                    </div>

                    <!-- Client validation error division -->
                    <div id="error" class="error-container mb-4" style="display:none;"></div>
                    <!-- Server side error division -->
                    <div th:if="${errorMsg}" class="alert alert-danger border-0 bg-danger-subtle text-danger p-3 rounded mb-4" id="server-error">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMsg}">Error Message</span>
                    </div>

                    <!-- Form -->
                    <form name="form" action="#" th:action="@{/addUser}" method="post" onsubmit="return verify()">
                        <!-- Username -->
                        <div class="mb-4">
                            <label for="inputUserName" class="form-label text-muted fw-semibold">Choose Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-slate border-glass text-muted" style="background: rgba(15,23,42,0.6); border-right: none;"><i class="fa-solid fa-user"></i></span>
                                <input type="text" name="userName" class="form-control" id="inputUserName" placeholder="Enter username" style="border-left: none;">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="inputPassword" class="form-label text-muted fw-semibold">Choose Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-slate border-glass text-muted" style="background: rgba(15,23,42,0.6); border-right: none;"><i class="fa-solid fa-key"></i></span>
                                <input type="password" name="password" class="form-control" id="inputPassword" placeholder="Enter password" style="border-left: none;">
                            </div>
                        </div>

                        <!-- Roles / Authorities checkboxes styled luxuriously -->
                        <div class="mb-5">
                            <label class="form-label text-muted fw-semibold mb-3 d-block"><i class="fa-solid fa-shield-halved me-1 text-cyan"></i> Select Account Roles</label>
                            
                            <div class="d-flex flex-column gap-3 p-3 rounded" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--border-glass);">
                                <!-- ROLE_USER -->
                                <div class="form-check d-flex align-items-center justify-content-between p-0 m-0">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fa-solid fa-user text-muted fs-6"></i>
                                        <label class="form-check-label text-white fw-medium cursor-pointer" for="ROLE_USER">Regular User</label>
                                    </div>
                                    <input type="checkbox" name="authorities" value="ROLE_USER" id="ROLE_USER" class="form-check-input ms-0" checked style="width: 20px; height: 20px;">
                                </div>

                                <!-- ROLE_MANAGER -->
                                <div class="form-check d-flex align-items-center justify-content-between p-0 m-0">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fa-solid fa-crown text-purple fs-6"></i>
                                        <label class="form-check-label text-white fw-medium cursor-pointer" for="ROLE_MANAGER">Content Manager</label>
                                    </div>
                                    <input type="checkbox" name="authorities" value="ROLE_MANAGER" id="ROLE_MANAGER" class="form-check-input ms-0" style="width: 20px; height: 20px;">
                                </div>
                            </div>
                            <div class="form-text text-muted fs-7 mt-2"><i class="fa-solid fa-info-circle me-1"></i>Managers can edit/delete reviews but require user role as well.</div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-grid gap-2 mb-4">
                            <button type="submit" class="btn btn-primary py-3 fs-6">
                                <i class="fa-solid fa-user-plus me-2"></i>Create Account
                            </button>
                        </div>
                    </form>

                    <!-- Footer login prompt -->
                    <div class="text-center border-top border-secondary border-opacity-25 pt-3 fs-7 text-muted">
                        Already have an account? <a href="#" th:href="@{/login}" class="text-cyan fw-semibold">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer.html :: page-footer"></footer>

    <!-- Custom script error show mapping -->
    <script>
        // Override standard validation error div show behavior to match glassmorphic error division
        const origVerify = window.verify;
        window.verify = function() {
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';
            const status = origVerify();
            if (!status) {
                errorDiv.style.display = 'block';
                // Remove raw text inside inline divs if any, keep it clean
                const innerText = errorDiv.innerText.trim();
                errorDiv.innerHTML = `❌ ${innerText}`;
            }
            return status;
        }
    </script>
</body>

</html>
